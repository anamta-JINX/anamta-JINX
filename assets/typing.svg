<svg xmlns="http://www.w3.org/2000/svg" width="760" height="60" viewBox="0 0 760 60" role="img" aria-labelledby="title">
  <title id="title">AI/ML Engineer | Software Engineer | Full-Stack Developer | Frontend Developer | Still debugging at 3 AM.</title>
  <defs><clipPath id="clip1"><rect class="reveal1" width="202" height="48"/></clipPath><clipPath id="clip2"><rect class="reveal2" width="245" height="48"/></clipPath><clipPath id="clip3"><rect class="reveal3" width="288" height="48"/></clipPath><clipPath id="clip4"><rect class="reveal4" width="259" height="48"/></clipPath><clipPath id="clip5"><rect class="reveal5" width="346" height="48"/></clipPath></defs>
  <style>
    text{font-family:Consolas,'Liberation Mono',monospace;font-size:22px;font-weight:400;fill:#111111}.caret{fill:#5A5A5A}@media (prefers-color-scheme:dark){text{fill:#F5F5F5}.caret{fill:#D7D7D7}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .line1{opacity:1;animation:show1 25s step-end infinite}
      @keyframes show1{0%{opacity:1}0%{opacity:1}20%,100%{opacity:0}}
      .reveal1{animation:reveal1 5s steps(14,end) infinite}
      .caret1{animation:cursor1 5s steps(14,end) infinite,blink .7s step-end infinite}
      @keyframes reveal1{0%,5%{width:0}32%,82%{width:202px}98%,100%{width:0}}
      @keyframes cursor1{0%,5%{transform:translateX(0)}32%,82%{transform:translateX(207px)}98%,100%{transform:translateX(0)}}.line2{opacity:0;animation:show2 25s step-end infinite}
      @keyframes show2{0%{opacity:0}20%{opacity:1}40%,100%{opacity:0}}
      .reveal2{animation:reveal2 5s steps(17,end) infinite}
      .caret2{animation:cursor2 5s steps(17,end) infinite,blink .7s step-end infinite}
      @keyframes reveal2{0%,5%{width:0}32%,82%{width:245px}98%,100%{width:0}}
      @keyframes cursor2{0%,5%{transform:translateX(0)}32%,82%{transform:translateX(250px)}98%,100%{transform:translateX(0)}}.line3{opacity:0;animation:show3 25s step-end infinite}
      @keyframes show3{0%{opacity:0}40%{opacity:1}60%,100%{opacity:0}}
      .reveal3{animation:reveal3 5s steps(20,end) infinite}
      .caret3{animation:cursor3 5s steps(20,end) infinite,blink .7s step-end infinite}
      @keyframes reveal3{0%,5%{width:0}32%,82%{width:288px}98%,100%{width:0}}
      @keyframes cursor3{0%,5%{transform:translateX(0)}32%,82%{transform:translateX(293px)}98%,100%{transform:translateX(0)}}.line4{opacity:0;animation:show4 25s step-end infinite}
      @keyframes show4{0%{opacity:0}60%{opacity:1}80%,100%{opacity:0}}
      .reveal4{animation:reveal4 5s steps(18,end) infinite}
      .caret4{animation:cursor4 5s steps(18,end) infinite,blink .7s step-end infinite}
      @keyframes reveal4{0%,5%{width:0}32%,82%{width:259px}98%,100%{width:0}}
      @keyframes cursor4{0%,5%{transform:translateX(0)}32%,82%{transform:translateX(264px)}98%,100%{transform:translateX(0)}}.line5{opacity:0;animation:show5 25s step-end infinite}
      @keyframes show5{0%{opacity:0}80%{opacity:1}100%,100%{opacity:0}}
      .reveal5{animation:reveal5 5s steps(24,end) infinite}
      .caret5{animation:cursor5 5s steps(24,end) infinite,blink .7s step-end infinite}
      @keyframes reveal5{0%,5%{width:0}32%,82%{width:346px}98%,100%{width:0}}
      @keyframes cursor5{0%,5%{transform:translateX(0)}32%,82%{transform:translateX(351px)}98%,100%{transform:translateX(0)}}
    @media(prefers-color-scheme:dark){text{fill:#F5F5F5}.caret{fill:#D7D7D7}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.line{opacity:0}.line1{opacity:1}.caret{opacity:0}.reveal1{width:202px}}
  </style>
  <g class="line line1" transform="translate(279.0 5)"><g clip-path="url(#clip1)"><text y="32" textLength="202" lengthAdjust="spacingAndGlyphs">AI/ML Engineer</text></g><rect class="caret caret1" y="10" width="2" height="26"/></g><g class="line line2" transform="translate(257.5 5)"><g clip-path="url(#clip2)"><text y="32" textLength="245" lengthAdjust="spacingAndGlyphs">Software Engineer</text></g><rect class="caret caret2" y="10" width="2" height="26"/></g><g class="line line3" transform="translate(236.0 5)"><g clip-path="url(#clip3)"><text y="32" textLength="288" lengthAdjust="spacingAndGlyphs">Full-Stack Developer</text></g><rect class="caret caret3" y="10" width="2" height="26"/></g><g class="line line4" transform="translate(250.5 5)"><g clip-path="url(#clip4)"><text y="32" textLength="259" lengthAdjust="spacingAndGlyphs">Frontend Developer</text></g><rect class="caret caret4" y="10" width="2" height="26"/></g><g class="line line5" transform="translate(207.0 5)"><g clip-path="url(#clip5)"><text y="32" textLength="346" lengthAdjust="spacingAndGlyphs">Still debugging at 3 AM.</text></g><rect class="caret caret5" y="10" width="2" height="26"/></g>
</svg>
