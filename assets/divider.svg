<svg xmlns="http://www.w3.org/2000/svg" width="960" height="24" viewBox="0 0 960 24" role="img" aria-label="Animated maroon line">
<defs><linearGradient id="base"><stop stop-color="#4E0000" stop-opacity="0"/><stop offset=".5" stop-color="#852039"/><stop offset="1" stop-color="#4E0000" stop-opacity="0"/></linearGradient><linearGradient id="light"><stop stop-color="#B7435A" stop-opacity="0"/><stop offset=".5" stop-color="#E8B8C0"/><stop offset="1" stop-color="#B7435A" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="960" height="24"/></clipPath></defs>
<style>.light{animation:glide 6s ease-in-out infinite}@keyframes glide{0%{transform:translateX(-180px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(960px);opacity:0}}@media(prefers-reduced-motion:reduce){.light{animation:none;transform:translateX(390px)}}</style>
<rect x="0" y="11.65" width="960" height=".7" fill="url(#base)"/><g clip-path="url(#clip)"><rect class="light" width="180" height="1" y="11.5" fill="url(#light)"/></g></svg>
