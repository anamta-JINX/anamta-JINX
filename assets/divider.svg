<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="38"
     viewBox="0 0 1200 38"
     role="img"
     aria-label="Animated maroon divider">

  <defs>

    <!-- Same deep crimson / maroon family as banner -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D182C" stop-opacity="0"/>
      <stop offset="18%" stop-color="#9D182C" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#B21F35" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#9D182C" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#9D182C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A71930" stop-opacity="0"/>
      <stop offset="42%" stop-color="#B82037" stop-opacity=".65"/>
      <stop offset="50%" stop-color="#C4273F"/>
      <stop offset="58%" stop-color="#B82037" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#A71930" stop-opacity="0"/>
    </linearGradient>

    <!-- Softer glow -->
    <filter id="glow"
            x="-30%"
            y="-400%"
            width="160%"
            height="900%">
      <feGaussianBlur stdDeviation="3.5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="38"/>
    </clipPath>

  </defs>

  <!-- subtle glow behind line -->
  <rect
    x="0"
    y="16"
    width="1200"
    height="6"
    rx="3"
    fill="url(#line)"
    opacity=".18"
    filter="url(#glow)"
  />

  <!-- main thin line -->
  <rect
    x="0"
    y="18"
    width="1200"
    height="2.5"
    rx="1.25"
    fill="url(#line)"
    filter="url(#glow)"
  />

  <!-- animated travelling glow -->
  <g clip-path="url(#clip)">
    <rect
      x="-260"
      y="16.75"
      width="260"
      height="5"
      rx="2.5"
      fill="url(#pulse)"
      filter="url(#glow)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;1460 0"
        dur="6s"
        repeatCount="indefinite"
      />

    </rect>
  </g>

</svg>
