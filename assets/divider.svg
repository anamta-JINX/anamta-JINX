<svg xmlns="http://www.w3.org/2000/svg" width="960" height="20" viewBox="0 0 960 20" role="img" aria-label="Animated maroon divider">
  <defs>
    <linearGradient id="base"><stop stop-color="#722039" stop-opacity=".08"/><stop offset=".5" stop-color="#a74763" stop-opacity=".6"/><stop offset="1" stop-color="#722039" stop-opacity=".08"/></linearGradient>
    <linearGradient id="light"><stop stop-color="#a74763" stop-opacity="0"/><stop offset=".5" stop-color="#e996ae"/><stop offset="1" stop-color="#a74763" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect y="9" width="960" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    .light { animation: glide 5.5s ease-in-out infinite; }
    @keyframes glide { 0% {transform:translateX(-220px);opacity:0} 12% {opacity:1} 88% {opacity:1} 100% {transform:translateX(960px);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .light {animation:none;transform:translateX(370px);} }
  </style>
  <rect y="9" width="960" height="2" rx="1" fill="url(#base)"/>
  <g clip-path="url(#clip)"><rect class="light" x="0" y="9" width="220" height="2" fill="url(#light)"/></g>
</svg>
