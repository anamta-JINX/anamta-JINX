<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="54" viewBox="0 0 1200 54" role="img" aria-label="Glowing oxblood divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74162D" stop-opacity="0"/>
      <stop offset=".18" stop-color="#74162D" stop-opacity=".30"/>
      <stop offset=".50" stop-color="#74162D" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#74162D" stop-opacity=".30"/>
      <stop offset="1" stop-color="#74162D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A1B35" stop-opacity="0"/>
      <stop offset=".45" stop-color="#A92A46" stop-opacity=".95"/>
      <stop offset=".50" stop-color="#C73657"/>
      <stop offset=".55" stop-color="#A92A46" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8A1B35" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="54" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- soft ambient glow -->
    <rect x="0" y="21" width="1200" height="12" rx="6" fill="url(#base)" opacity=".22" filter="url(#glow)"/>

    <!-- main thick divider -->
    <rect x="0" y="24" width="1200" height="6" rx="3" fill="url(#base)" filter="url(#glow)"/>

    <!-- moving glow pulse -->
    <rect x="-320" y="21" width="320" height="12" rx="6" fill="url(#pulse)" filter="url(#glow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;1520 0"
        dur="5.8s"
        repeatCount="indefinite" />
    </rect>
  </g>
</svg>
