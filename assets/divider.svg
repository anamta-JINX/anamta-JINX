<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="38"
     viewBox="0 0 1200 38"
     role="img"
     aria-label="Animated monochrome divider">
  <style>
    .dark-theme{display:none}
    @media (prefers-color-scheme:dark){
      .light-theme{display:none}
      .dark-theme{display:inline}
    }
  </style>
  <defs>
    <linearGradient id="lightLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111" stop-opacity="0"/>
      <stop offset="18%" stop-color="#111111" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#111111" stop-opacity=".9"/>
      <stop offset="82%" stop-color="#111111" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lightPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#555555" stop-opacity="0"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#555555" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="darkLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F5F5" stop-opacity="0"/>
      <stop offset="18%" stop-color="#D8D8D8" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#F5F5F5" stop-opacity=".92"/>
      <stop offset="82%" stop-color="#D8D8D8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="darkPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8D8D8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8D8D8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="38"/></clipPath>
  </defs>

  <g class="light-theme">
    <rect x="0" y="18" width="1200" height="2.5" rx="1.25" fill="url(#lightLine)"/>
    <g clip-path="url(#clip)">
      <rect x="-260" y="17" width="260" height="4.5" rx="2.25" fill="url(#lightPulse)" filter="url(#glow)">
        <animateTransform attributeName="transform" type="translate" values="0 0;1460 0" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g class="dark-theme">
    <rect x="0" y="18" width="1200" height="2.5" rx="1.25" fill="url(#darkLine)" filter="url(#glow)"/>
    <g clip-path="url(#clip)">
      <rect x="-260" y="17" width="260" height="4.5" rx="2.25" fill="url(#darkPulse)" filter="url(#glow)">
        <animateTransform attributeName="transform" type="translate" values="0 0;1460 0" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>