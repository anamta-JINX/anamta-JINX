<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="38" viewBox="0 0 1200 38" role="img" aria-label="Animated oxblood divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74162D" stop-opacity="0"/>
      <stop offset=".2" stop-color="#74162D" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#74162D" stop-opacity=".75"/>
      <stop offset=".8" stop-color="#74162D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#74162D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A1B35" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8A1B35"/>
      <stop offset="1" stop-color="#8A1B35" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="38"/></clipPath>
  </defs>
  <rect x="0" y="18" width="1200" height="1.3" fill="url(#base)"/>
  <g clip-path="url(#c)">
    <rect x="-260" y="17.2" width="250" height="2.8" rx="1.4" fill="url(#pulse)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1460 0" dur="6.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>