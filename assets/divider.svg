<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="54" viewBox="0 0 1200 54" role="img" aria-label="Glowing crimson divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F1B34" stop-opacity="0"/>
      <stop offset=".18" stop-color="#8F1B34" stop-opacity=".34"/>
      <stop offset=".50" stop-color="#A82440" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#8F1B34" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8F1B34" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A82440" stop-opacity="0"/>
      <stop offset=".42" stop-color="#BC2F4A" stop-opacity=".92"/>
      <stop offset=".50" stop-color="#D6405D"/>
      <stop offset=".58" stop-color="#BC2F4A" stop-opacity=".92"/>
      <stop offset="1" stop-color="#A82440" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="5.5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="54" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="21" width="1200" height="12" rx="6" fill="url(#base)" opacity=".24" filter="url(#glow)"/>
    <rect x="0" y="24" width="1200" height="6" rx="3" fill="url(#base)" filter="url(#glow)"/>

    <rect x="-320" y="21" width="320" height="12" rx="6" fill="url(#pulse)" filter="url(#glow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;1520 0"
        dur="5.8s"
        repeatCount="indefinite"/>
    </rect>
  </g>
</svg>