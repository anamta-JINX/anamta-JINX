<svg xmlns="http://www.w3.org/2000/svg" width="960" height="112" viewBox="0 0 960 112" role="img" aria-label="Maroon wave footer">
  <defs><linearGradient id="wine" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#761d39"/><stop offset="1" stop-color="#270e18"/></linearGradient><clipPath id="clip"><rect width="960" height="112" rx="10"/></clipPath></defs>
  <style>.wave {animation:drift 11s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(-25px)}to{transform:translateX(25px)}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style>
