<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Anamta Gohar</title>
  <desc id="desc">Software Engineer | AI/ML Engineer | Full-Stack Developer. An animated maroon wave banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#200b13"/><stop offset=".55" stop-color="#55152b"/><stop offset="1" stop-color="#8b2342"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1"><stop stop-color="#9c3655"/><stop offset="1" stop-color="#eaa1b2"/></linearGradient>
    <linearGradient id="rule"><stop stop-color="#efabb9"/><stop offset="1" stop-color="#efabb9" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="960" height="280" rx="12"/></clipPath>
  </defs>
  <style>
    .wave-back { animation: tide 12s ease-in-out infinite alternate; }
    .wave-front { animation: tide 9s ease-in-out infinite alternate-reverse; }
    @keyframes tide { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    @media (prefers-reduced-motion: reduce) { .wave-back, .wave-front { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="url(#background)"/>
    <g fill="none" stroke="#e7a1b2" stroke-opacity=".09">
      <circle cx="895" cy="35" r="105"/><circle cx="895" cy="35" r="143"/><circle cx="895" cy="35" r="181"/>
      <path d="M728 0v186M766 0v186M804 0v186M842 0v186M880 0v186M918 0v186M690 35h270M690 73h270M690 111h270M690 149h270" stroke-opacity=".045"/>
    </g>
    <rect x="58" y="45" width="32" height="3" rx="1.5" fill="#efabb9"/>
    <text x="102" y="51" fill="#e4a0b1" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.8">anamta-JINX</text>
    <text x="54" y="134" fill="#fff5f7" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="-2.6">Anamta Gohar</text>
    <text x="58" y="171" fill="#edcbd4" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="19" letter-spacing=".15">Software Engineer | AI/ML Engineer | Full-Stack Developer</text>
    <rect x="58" y="198" width="350" height="1" fill="url(#rule)"/>
    <path class="wave-back" d="M-80 245C110 175 250 284 450 237S730 166 1040 218V300H-80Z" fill="#bf5473" opacity=".23"/>
    <path class="wave-front" d="M-80 259C140 191 315 301 527 254S780 188 1040 239V300H-80Z" fill="url(#wave)" opacity=".33"/>
    <path d="M-80 278C180 225 375 309 606 270S818 241 1040 259V300H-80Z" fill="#e6a3b5" opacity=".15"/>
    <rect x=".5" y=".5" width="959" height="279" rx="11.5" fill="none" stroke="#b05c75" stroke-opacity=".3"/>
  </g>
</svg>
