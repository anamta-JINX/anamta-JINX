<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Anamta Gohar — AI/ML Engineer and Software Engineer</title>
  <desc id="desc">Black cherry maroon banner with layered animated waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100509"/>
      <stop offset="45%" stop-color="#330A16"/>
      <stop offset="100%" stop-color="#65152B"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="14%" r="68%">
      <stop offset="0%" stop-color="#B84963" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#B84963" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A0D1D"/>
      <stop offset="48%" stop-color="#8A203A"/>
      <stop offset="100%" stop-color="#5C1125"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1830"/>
      <stop offset="52%" stop-color="#B33A56"/>
      <stop offset="100%" stop-color="#6E152B"/>
    </linearGradient>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.8"/>
      <feOffset dx="5" dy="6" result="shadow"/>
      <feColorMatrix in="shadow" type="matrix" values="0 0 0 0 .05 0 0 0 0 .005 0 0 0 0 .015 0 0 0 .95 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="410" fill="url(#bg)"/>
  <rect width="1200" height="410" fill="url(#glow)"/>

  <g opacity=".16" stroke="#EFC0CB" stroke-width="1" fill="none">
    <path d="M0 70 H1200"/><path d="M0 88 H1200"/><path d="M0 106 H1200"/>
  </g>

  <text x="600" y="92" text-anchor="middle" fill="#D98FA3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5.2">
    AI / ML · SOFTWARE · SYSTEMS
  </text>

  <text x="600" y="193" text-anchor="middle" fill="#FFF7F9" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="-1.7" filter="url(#depth)">
    Anamta Gohar
  </text>

  <text x="600" y="241" text-anchor="middle" fill="#F0D3DB" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.4">
    AI/ML Engineer · Software Engineer · Full-Stack Developer
  </text>
  <text x="600" y="273" text-anchor="middle" fill="#C78396" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.2">
    curious enough to open the black box.
  </text>

  <path d="M-100 336 C120 286 270 390 500 334 S850 281 1300 344 L1300 410 L-100 410 Z" fill="url(#wave1)" opacity=".92">
    <animateTransform attributeName="transform" type="translate" values="-30 0;25 -5;-30 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M-120 360 C135 307 330 405 595 354 S980 308 1320 366 L1320 410 L-120 410 Z" fill="url(#wave2)" opacity=".72">
    <animateTransform attributeName="transform" type="translate" values="25 0;-22 4;25 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M-100 381 C140 342 320 411 610 376 S990 344 1300 388 L1300 410 L-100 410 Z" fill="#18070D" opacity=".9">
    <animateTransform attributeName="transform" type="translate" values="-16 0;18 -2;-16 0" dur="15s" repeatCount="indefinite"/>
  </path>
</svg>