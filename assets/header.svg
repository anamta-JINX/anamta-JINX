<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anamta Gohar — AI/ML Engineer and Software Engineer</title>
  <desc id="desc">Minimal black-cherry maroon profile banner with subtle animated waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16080D"/>
      <stop offset="48%" stop-color="#3A0B18"/>
      <stop offset="100%" stop-color="#73172F"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#C45A76" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#C45A76" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="4" dy="5" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.01 0 0 0 0 0.03 0 0 0 .9 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>

  <g fill="none" stroke="#E7A8B7" stroke-width="1.3" opacity=".16">
    <path d="M-80 64 C190 10 315 125 540 62 S885 7 1280 78">
      <animateTransform attributeName="transform" type="translate" values="0 0;-34 8;0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-90 302 C178 236 340 347 580 286 S946 230 1290 300">
      <animateTransform attributeName="transform" type="translate" values="0 0;44 -7;0 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity=".45" fill="#EFC5CE">
    <circle cx="105" cy="108" r="3"/>
    <circle cx="1070" cy="118" r="2"/>
    <circle cx="1125" cy="250" r="3"/>
    <circle cx="178" cy="268" r="2"/>
  </g>

  <text x="600" y="88" text-anchor="middle" fill="#DFA0B0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5">
    AI / ML · SOFTWARE · SYSTEMS
  </text>

  <text x="600" y="190" text-anchor="middle" fill="#FFF7F8" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="-1.5" filter="url(#softShadow)">
    Anamta Gohar
  </text>

  <line x1="470" y1="218" x2="730" y2="218" stroke="#C65A76" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="259" text-anchor="middle" fill="#F1D9DF" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.3">
    AI/ML Engineer · Software Engineer
  </text>

  <text x="600" y="295" text-anchor="middle" fill="#C98A9A" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1">
    systems first. aesthetics included.
  </text>
</svg>