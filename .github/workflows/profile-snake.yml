name: Refresh monochrome contribution snake

on:
  schedule:
    # 06:17 in Pakistan (UTC+05:00).
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#F5F5F5&color_dots=#121212,#303030,#666666,#A6A6A6,#E8E8E8
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#F5F5F5&color_dots=#080808,#282828,#5F5F5F,#A0A0A0,#E8E8E8

      - name: Add progressive snake growth and polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def polish(path: Path, dark: bool):
              svg = path.read_text(encoding='utf-8')
              m = re.search(r'animation:none\s+(\d+)ms\s+linear\s+infinite', svg)
              if not m:
                  raise RuntimeError(f'Could not detect animation duration in {path}')
              duration = int(m.group(1))

              root = (
                  ':root{--cb:#FFFFFF12;--cs:#F5F5F5;--sh:#FFFFFF;'
                  '--ce:#080808;--c0:#080808;--c1:#282828;--c2:#5F5F5F;'
                  '--c3:#A0A0A0;--c4:#E8E8E8}'
                  if dark else
                  ':root{--cb:#1b1f230a;--cs:#F5F5F5;--sh:#FFFFFF;'
                  '--ce:#121212;--c0:#121212;--c1:#303030;--c2:#666666;'
                  '--c3:#A6A6A6;--c4:#E8E8E8}'
              )
              svg = re.sub(r':root\{[^}]+\}', root, svg, count=1)

              # Remove the generated horizontal bar beneath the contribution grid.
              svg = re.sub(r'<rect class="u u\d+"[^>]*/>', '', svg)

              # Tighten the canvas after removing the bottom bar.
              svg = svg.replace(
                  'viewBox="-16 -32 880 192"',
                  'viewBox="-16 -32 880 160"'
              ).replace(
                  'width="880" height="192"',
                  'width="880" height="160"'
              )

              thresholds = [12, 20, 28, 36, 46, 56, 66, 76]
              css = '''
          /* Custom Anamta-JINX snake: banner-matched monochrome + progressive growth */
          .s.s0{fill:var(--sh)!important;filter:drop-shadow(0 0 3px #FFFFFF)}
          .s.s1{fill:#F5F5F5!important}
          .s.s2{fill:#E5E5E5!important}
          .s.s3{fill:#D2D2D2!important}
          '''
              for j, threshold in enumerate(thresholds):
                  cls = 4 + j
                  trail_ms = 400 + (j * 100)
                  delay = -(duration - trail_ms)
                  opacity = 0.96 - (j * 0.045)
                  fill = '#D2D2D2' if j < 3 else ('#BDBDBD' if j < 6 else '#9E9E9E')
                  css += f'''
          @keyframes grow{cls}{{0%,{threshold-0.1:.1f}%{{opacity:0}}{threshold}%,99.8%{{opacity:{opacity:.2f}}}99.9%,100%{{opacity:0}}}}
          .s.s{cls}{{
            fill:{fill}!important;
            animation-name:s0,grow{cls};
            animation-duration:{duration}ms,{duration}ms;
            animation-timing-function:linear,step-end;
            animation-iteration-count:infinite,infinite;
            animation-delay:{delay}ms,0ms;
          }}
          '''
              svg = svg.replace('</style>', css + '</style>', 1)

              sizes = [9.6, 9.4, 9.2, 9.0, 8.8, 8.6, 8.4, 8.2]
              extra = ''
              for j, size in enumerate(sizes):
                  cls = 4 + j
                  xy = 8 - size / 2
                  radius = size / 3
                  extra += (
                      f'<rect class="s s{cls}" x="{xy:.2f}" y="{xy:.2f}" '
                      f'width="{size}" height="{size}" rx="{radius:.2f}" ry="{radius:.2f}"/>'
                  )

              svg = svg.replace('</svg>', extra + '</svg>', 1)
              path.write_text(svg, encoding='utf-8')

          polish(Path('assets/github-snake.svg'), False)
          polish(Path('assets/github-snake-dark.svg'), True)
          PY

      - name: Check both SVG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for name in ('github-snake.svg', 'github-snake-dark.svg'):
              path = Path('assets') / name
              root = ElementTree.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert path.stat().st_size > 1000, path
          PY

      - name: Save refreshed animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already current."
            exit 0
          fi
          git commit -m "chore: refresh monochrome contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
